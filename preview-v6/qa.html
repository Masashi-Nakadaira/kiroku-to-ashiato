<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI responsive QA</title><style>body{margin:0;background:#65706c;font-family:system-ui}nav{height:50px;display:flex;gap:10px;align-items:center;padding:0 16px}button{min-height:40px}iframe{display:block;border:0;margin:0;width:390px;height:844px;background:#233337}</style><nav><button data-size="390,844">Mobile390</button><button data-size="844,390">Landscape844</button><button data-size="1440,1024">Desktop1440</button><button data-size="320,640">Narrow320</button></nav><iframe title="Game preview" src="index.html?review=r4"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const[w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px'};</script></html>
