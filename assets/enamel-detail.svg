<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">二つの青い欠片の観察図</title><desc id="desc">祭壇の布の内側で見つかった欠片と、花盆の縁の溝で見つかった欠片を同じ拡大率で描いた図。片側に尖った突起と小さなくぼみがあり、それぞれの割れ目と細い白い釉薬の筋を見比べられる。</desc>
<defs><linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5aa9c8"/><stop offset=".55" stop-color="#24627d"/><stop offset="1" stop-color="#163951"/></linearGradient><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 23.5H24" stroke="#cfc5ac" stroke-opacity=".2"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="960" height="800" rx="24" fill="#eee8d9"/><rect width="960" height="800" rx="24" fill="url(#paper)"/>
<text x="48" y="60" font-family="serif" font-size="27" fill="#302f27">青い欠片　観察図</text><text x="48" y="90" font-family="sans-serif" font-size="15" fill="#777365">同じ拡大率で、表面を上にして置いた状態</text>
<path d="M480 125V473" stroke="#c5bba4" stroke-width="1"/>
<g filter="url(#shadow)" stroke="#182f3a" stroke-width="3" stroke-linejoin="round">
