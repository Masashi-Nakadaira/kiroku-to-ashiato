<text x="280" y="609" text-anchor="middle" font-family="serif" font-size="20" fill="#373c35">台帳の杯底輪郭</text><text x="695" y="609" text-anchor="middle" font-family="serif" font-size="20" fill="#373c35">花盆の底の観察</text>
