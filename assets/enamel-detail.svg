<path d="M434 512H526M434 507V517M526 507V517" stroke="#555b50" stroke-width="2"/><text x="480" y="544" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#747567">拡大した形の記録（実寸ではありません）</text>
