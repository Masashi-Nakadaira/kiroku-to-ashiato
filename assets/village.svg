<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">井戸端の合図・調査用配置図</title><desc id="desc">鐘楼、種蔵、水車、窯場、井戸、染場の配置。種蔵の横戸へは染場の外側の石畳を回る。建物同士のすき間は通路ではない。</desc>
<defs><pattern id="paving" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 0H28V20H0ZM14 0V20" fill="none" stroke="#baae93" stroke-width=".7"/></pattern><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#a96635"/></marker></defs>
<rect width="1000" height="480" fill="#e9e2cf"/><rect x="35" y="22" width="642" height="427" rx="14" fill="#d1c5ac" stroke="#91856d" stroke-width="7"/><rect x="48" y="35" width="616" height="400" fill="url(#paving)"/>
<g stroke="#665e4b" stroke-width="3"><rect x="222" y="85" width="101" height="90" fill="#8dada0"/><rect x="351" y="105" width="158" height="108" fill="#b5b59a"/><rect x="492" y="216" width="106" height="81" fill="#8dada0"/><rect x="156" y="229" width="101" height="68" fill="#b37d5b"/><rect x="162" y="348" width="95" height="57" fill="#b37d5b"/></g>
<!-- The side opening faces the outer paving, not an invented passage between buildings. -->
<path d="M509 147V181" stroke="#e9e2cf" stroke-width="7"/><path d="M510 142H523V185" fill="none" stroke="#796246" stroke-width="5"/>
<rect x="369" y="207" width="25" height="9" fill="#755641"/><circle cx="381" cy="212" r="6" fill="#af493b"/>
<rect x="380" y="141" width="25" height="19" fill="#e7dac1" stroke="#765e43" stroke-width="2"/><path d="M501 165L411 165 413 174 501 174" fill="none" stroke="#6d7568" stroke-width="3" stroke-dasharray="4 5"/>
<path d="M608 336L632 336V165H526" fill="none" stroke="#a96635" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#end)"/>
<path d="M492 304H598" stroke="#476d79" stroke-width="9"/>
<circle cx="359" cy="351" r="23" fill="#b0aa8e" stroke="#746e58" stroke-width="4"/><circle cx="359" cy="351" r="14" fill="#638080"/><path d="M332 331H386M339 327V365M379 327V365M359 331V351" stroke="#876947" fill="none" stroke-width="4"/>
<rect x="297" y="290" width="36" height="23" fill="#f0e6cd" stroke="#876947" stroke-width="3"/>
<circle cx="132" cy="378" r="26" fill="#98774f" stroke="#68553a" stroke-width="3"/><path d="M106 378H158M132 352V404M113 359L151 397M113 397L151 359" stroke="#d3bb8d" stroke-width="3"/>
<g fill="#374b43" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="272" y="148">鐘楼</text><text x="430" y="126">種蔵</text><text x="208" y="276">窯場</text><text x="545" y="267">染場</text><text x="210" y="388">水車小屋</text><text x="359" y="397">井戸</text><text x="290" y="331">読み上げ台</text></g>
<g fill="#344c46" font-family="sans-serif"><text x="706" y="57" font-size="21">聞き取りと比較資料</text><rect x="716" y="108" width="259" height="119" rx="7" fill="#f5efdf" stroke="#b9ad91"/><text x="741" y="137" font-size="16">三人の仕事</text><text x="741" y="209" font-size="15">本人を見ていた証人の記録</text><rect x="716" y="270" width="259" height="114" rx="7" fill="#f5efdf" stroke="#b9ad91"/><text x="741" y="299" font-size="16">靴の見本札</text><text x="741" y="365" font-size="15">左かかとの写しを比較</text><text x="48" y="468" font-size="13">調査用の配置図。比率は模式。合図の順序は証拠本文で確かめる。</text><text x="703" y="426" font-size="14">茶色の点線：染場の外側から横戸へ</text></g>
</svg>
