<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">応答する空席・調査用配置図</title><desc id="desc">技師室と原本室。手前の開口部に認証端末があり、奥はガラス仕切り。開いた手動トレイは発見後の調査状態。試験室と搬入口の証言は別の資料。</desc>
<defs><pattern id="tiles" width="52" height="46" patternUnits="userSpaceOnUse"><path d="M0 0H52V46H0Z" stroke="#b5c8c7" stroke-width="1" fill="none"/></pattern></defs>
<rect width="1000" height="480" fill="#dce8e5"/><rect x="32" y="38" width="640" height="395" rx="8" fill="#eef3ef" stroke="#6c8a8b" stroke-width="7"/><rect x="38" y="44" width="628" height="383" fill="url(#tiles)"/>
<path d="M332 42V246M332 287V418" stroke="#779b9d" stroke-width="8"/><path d="M330 90V188" stroke="#8ccece" stroke-width="13"/>
<rect x="90" y="175" width="172" height="93" rx="5" fill="#c2d6d1" stroke="#728e8b" stroke-width="3"/><rect x="112" y="146" width="116" height="62" fill="#2a6268" stroke="#44797c" stroke-width="3"/><path d="M127 163H211M127 176H189M127 188H202" stroke="#93c1bc" stroke-width="3"/><rect x="220" y="224" width="29" height="25" fill="#41696a"/><circle cx="171" cy="314" r="30" fill="#97b1ac" stroke="#6b8580" stroke-width="4"/>
<rect x="423" y="137" width="177" height="118" rx="5" fill="#668d8d" stroke="#3b6569" stroke-width="4"/><rect x="439" y="251" width="145" height="58" fill="#c1d5ca" stroke="#3b6569" stroke-width="4"/><circle cx="492" cy="277" r="21" fill="#e0e9df" stroke="#6e9390" stroke-width="3"/><circle cx="492" cy="277" r="4" fill="#78938d"/><path d="M548 280L573 266V280Z" fill="#65a489" stroke="#4a826f"/><rect x="550" y="287" width="22" height="14" fill="#a5d7c5" fill-opacity=".7" stroke="#537f76"/><rect x="426" y="228" width="14" height="27" fill="#c79762"/><rect x="582" y="228" width="14" height="27" fill="#c79762"/>
<rect x="343" y="260" width="23" height="30" rx="2" fill="#326d70"/><rect x="349" y="265" width="11" height="9" fill="#acd4c5"/>
<rect x="459" y="358" width="142" height="38" fill="#bed5cd" stroke="#73948d" stroke-width="3"/><path d="M473 382L499 366V382ZM516 382L542 366V382Z" fill="#65a489"/><rect x="561" y="367" width="25" height="15" fill="#a4b9b2" stroke="#647f79"/>
<g fill="#33585a" font-family="sans-serif" text-anchor="middle"><text x="173" y="83" font-size="21">技師室</text><text x="505" y="83" font-size="21">原本室</text><text x="265" y="115" font-size="13">奥は仕切り</text><text x="174" y="362" font-size="15">在席は証言で確かめる</text><text x="510" y="334" font-size="14">開放は発見後の調査状態</text><text x="390" y="411" font-size="13">手前の開口部</text></g>
<g font-family="sans-serif" fill="#33585a"><text x="710" y="57" font-size="21">別の場所での対面証言</text><rect x="720" y="108" width="253" height="119" rx="7" fill="#f2f6ec" stroke="#a6bdb5"/><text x="744" y="136" font-size="17">試験室の記録</text><text x="744" y="208" font-size="15">ナギ本人の顔と身体</text><rect x="720" y="271" width="253" height="113" rx="7" fill="#f2f6ec" stroke="#a6bdb5"/><text x="744" y="299" font-size="17">搬入口の記録</text><text x="744" y="365" font-size="15">ユン本人の顔と身体</text><text x="37" y="467" font-size="13">調査用の配置図。無人の椅子や開いたトレイから、事件中の在席・時刻は推定しない。</text></g>
</svg>
